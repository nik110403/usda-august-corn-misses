[project]
name = "cfstore"
version = "0.1.0"
description = "As-of store and leakage tests for the US corn yield calibration audit"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfstore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
